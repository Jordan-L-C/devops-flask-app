name: Build Game of Life

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Run the build script
        run: ./build.sh

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: game-of-life
          path: dist/
